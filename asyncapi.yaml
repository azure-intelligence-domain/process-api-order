    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.paid
    publish:
      operationId: publishOrderPaid
      summary: Publish OrderPaid.
      description: 'The Order Process API publishes OrderPaid when this fact happens: The order is fully paid. Triggered
        by finance''s PaymentReceived (policy: when the received payments cover the invoice, the order is paid).'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderPaid in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderPaid
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderPaid'
  order.process-api-order.event.order-ready-for-shipment:
    description: All stock for the order is reserved and it can be shipped. Triggered by supply's StockReserved.
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.readyForShipment
    publish:
      operationId: publishOrderReadyForShipment
      summary: Publish OrderReadyForShipment.
      description: 'The Order Process API publishes OrderReadyForShipment when this fact happens: All stock for
        the order is reserved and it can be shipped. Triggered by supply''s StockReserved.'
      security:
