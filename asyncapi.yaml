  schemas:
    channel:
      type: string
      description: Where the order was placed.
      enum:
      - salesforce
      - webshop
      - agent
    money:
      type: object
      description: An amount of money.
      required:
      - value
      - currency
      properties:
        value:
          type: number
          description: The amount.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code.
    deliveryAddress:
      type: object
      description: Where the order is delivered.
      required:
      - street
      - postalCode
      - city
      - countryCode
      properties:
        street:
          type: string
          description: Street and number.
        postalCode:
          type: string
          description: Postal code.
        city:
          type: string
          description: City.
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 country code.
    orderLine:
      type: object
      description: One product in the order.
      required:
      - lineNumber
      - productId
      - quantity
      - unitPrice
      properties:
        lineNumber:
          type: integer
          minimum: 1
          description: Position in the order.
        productId:
          type: string
          description: The product.
        quantity:
          type: integer
          minimum: 1
          description: Units ordered.
        unitPrice:
          $ref: '#/components/schemas/money'
    orderPlacedData:
      type: object
      description: What OrderPlaced says.
      required:
      - orderId
      - customerId
      - channel
      - orderLines
      - totalAmount
      - deliveryAddress
      - placedAt
      properties:
        orderId:
          type: string
          description: The order id.
        customerId:
          type: string
          description: The customer.
        channel:
          $ref: '#/components/schemas/channel'
        orderLines:
          type: array
          minItems: 1
          description: The products ordered.
          items:
            $ref: '#/components/schemas/orderLine'
        totalAmount:
          $ref: '#/components/schemas/money'
        deliveryAddress:
          $ref: '#/components/schemas/deliveryAddress'
        requestedDeliveryDate:
          type: string
          format: date
          description: Requested delivery date. ISO 8601.
        placedAt:
          type: string
          format: date-time
          description: When the order was placed. ISO 8601, UTC.
    orderConfirmedData:
      type: object
      description: What OrderConfirmed says.
      required:
      - orderId
      - confirmedAt
      properties:
        orderId:
          type: string
          description: The order id.
        erpOrderNumber:
          type: string
          description: The order number in the ERP.
        confirmedAt:
          type: string
          format: date-time
          description: When the ERP confirmed. ISO 8601, UTC.
    orderRejectedData:
      type: object
      description: What OrderRejected says.
      required:
      - orderId
      - reason
      - rejectedAt
      properties:
        orderId:
          type: string
          description: The order id.
        reason:
          type: string
          description: Why the order was rejected.
        rejectedAt:
          type: string
          format: date-time
          description: When it was rejected. ISO 8601, UTC.
    orderAmendedData:
      type: object
      description: What OrderAmended says.
      required:
      - orderId
      - orderLines
      - totalAmount
      - amendedAt
      properties:
        orderId:
          type: string
          description: The order id.
        orderLines:
          type: array
          minItems: 1
          description: All order lines after the amendment.
          items:
            $ref: '#/components/schemas/orderLine'
        totalAmount:
          $ref: '#/components/schemas/money'
        amendedAt:
          type: string
          format: date-time
          description: When the order was amended. ISO 8601, UTC.
    orderDeliveryAddressChangedData:
      type: object
      description: What OrderDeliveryAddressChanged says.
      required:
      - orderId
      - deliveryAddress
      - changedAt
      properties:
        orderId:
          type: string
          description: The order id.
        deliveryAddress:
          $ref: '#/components/schemas/deliveryAddress'
        changedAt:
          type: string
          format: date-time
          description: When the address changed. ISO 8601, UTC.
    orderDeliveryRescheduledData:
      type: object
      description: What OrderDeliveryRescheduled says.
      required:
      - orderId
      - requestedDeliveryDate
      - rescheduledAt
      properties:
        orderId:
          type: string
          description: The order id.
        requestedDeliveryDate:
          type: string
          format: date
          description: The new requested delivery date. ISO 8601.
        previousRequestedDeliveryDate:
          type: string
          format: date
          description: The date before the change. ISO 8601.
        rescheduledAt:
          type: string
          format: date-time
          description: When the delivery was rescheduled. ISO 8601, UTC.
    orderPutOnHoldData:
      type: object
      description: What OrderPutOnHold says.
      required:
      - orderId
      - reason
      - heldAt
      properties:
        orderId:
          type: string
