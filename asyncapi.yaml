        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderReadyForShipment in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderReadyForShipment
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderReadyForShipment'
  order.process-api-order.event.order-shipped:
    description: The order left the warehouse with the third-party logistics partner. Triggered by logistics' ShipmentDispatched.
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.shipped
    publish:
      operationId: publishOrderShipped
      summary: Publish OrderShipped.
      description: 'The Order Process API publishes OrderShipped when this fact happens: The order left the warehouse
        with the third-party logistics partner. Triggered by logistics'' ShipmentDispatched.'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderShipped in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderShipped
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderShipped'
  order.process-api-order.event.order-delivered:
    description: The customer received the order. Triggered by logistics' ShipmentDelivered.
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.delivered
    publish:
      operationId: publishOrderDelivered
      summary: Publish OrderDelivered.
      description: 'The Order Process API publishes OrderDelivered when this fact happens: The customer received
        the order. Triggered by logistics'' ShipmentDelivered.'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderDelivered in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderDelivered
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderDelivered'
  order.process-api-order.event.order-completed:
    description: 'The order is delivered and paid: nothing is left to do. Triggered when the second of OrderDelivered
      and OrderPaid happens.'
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.completed
    publish:
      operationId: publishOrderCompleted
      summary: Publish OrderCompleted.
      description: 'The Order Process API publishes OrderCompleted when this fact happens: The order is delivered
        and paid: nothing is left to do. Triggered when the second of OrderDelivered and OrderPaid happens.'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderCompleted in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderCompleted
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderCompleted'
components:
  securitySchemes:
    entraIdEventGrid:
      $ref: https://raw.githubusercontent.com/azure-intelligence-domain/contracts/v1.2.0/asyncapi/landscape.asyncapi.yaml#/components/securitySchemes/entraIdEventGrid
  messages:
    orderPlaced:
      messageId: orderPlaced
      name: orderPlaced
      title: Order Placed
      summary: 'A customer committed to an order: a Salesforce opportunity was closed-won, or a webshop or an agent
        placed it.'
      description: 'CloudEvent of type com.acme.order.placed. A customer committed to an order: a Salesforce opportunity
        was closed-won, or a webshop or an agent placed it. Carries the whole order, so consumers can keep their
        own copy.'
      contentType: application/cloudevents+json
      payload:
        allOf:
        - $ref: https://raw.githubusercontent.com/azure-intelligence-domain/contracts/v1.2.0/schemas/envelope/1.1.0/envelope.schema.json
        - type: object
          description: What this event adds to the envelope.
          required:
          - type
          - orderid
          - customerid
          - data
          properties:
            type:
              const: com.acme.order.placed
            orderid:
              type: string
            customerid:
              type: string
            data:
              $ref: '#/components/schemas/orderPlacedData'
      examples:
      - name: acmeOrder4711
        summary: OrderPlaced for ACME's order 4711.
        payload:
          specversion: '1.0'
          id: orderPlaced-4711-0001
          source: /process-api-order/0.1.0
          type: com.acme.order.placed
          time: '2026-10-03T09:12:01Z'
          datacontenttype: application/json
          correlationid: ord-4711
          customerid: ACME
          orderid: '4711'
          data:
            orderId: '4711'
            customerId: ACME
            channel: salesforce
            orderLines:
            - lineNumber: 1
              productId: SKU-1042
              quantity: 12
              unitPrice: &id001
                value: 7000.0
                currency: EUR
            totalAmount:
              value: 84000.0
              currency: EUR
            deliveryAddress: &id002
              street: Rue de la Loi 16
              postalCode: '1000'
              city: Brussels
              countryCode: BE
            requestedDeliveryDate: '2026-10-09'
            placedAt: '2026-10-03T09:12:00Z'
    orderConfirmed:
      messageId: orderConfirmed
      name: orderConfirmed
      title: Order Confirmed
      summary: The ERP accepted the order (credit and availability checks passed).
      description: CloudEvent of type com.acme.order.confirmed. The ERP accepted the order (credit and availability
        checks passed). Triggered by the ERP's confirmation.
      contentType: application/cloudevents+json
      payload:
        allOf:
        - $ref: https://raw.githubusercontent.com/azure-intelligence-domain/contracts/v1.2.0/schemas/envelope/1.1.0/envelope.schema.json
        - type: object
          description: What this event adds to the envelope.
          required:
          - type
          - orderid
          - customerid
          - data
          properties:
            type:
              const: com.acme.order.confirmed
            orderid:
              type: string
            customerid:
              type: string
            data:
              $ref: '#/components/schemas/orderConfirmedData'
      examples:
      - name: acmeOrder4711
        summary: OrderConfirmed for ACME's order 4711.
        payload:
          specversion: '1.0'
          id: orderConfirmed-4711-0001
          source: /process-api-order/0.1.0
          type: com.acme.order.confirmed
          time: '2026-10-03T09:15:01Z'
          datacontenttype: application/json
          correlationid: ord-4711
          customerid: ACME
          orderid: '4711'
          data:
            orderId: '4711'
            erpOrderNumber: '8000043217'
            confirmedAt: '2026-10-03T09:15:00Z'
    orderRejected:
      messageId: orderRejected
      name: orderRejected
      title: Order Rejected
      summary: The ERP refused the order, for example a failed credit check.
      description: CloudEvent of type com.acme.order.rejected. The ERP refused the order, for example a failed credit
        check. The order ends here.
      contentType: application/cloudevents+json
      payload:
        allOf:
        - $ref: https://raw.githubusercontent.com/azure-intelligence-domain/contracts/v1.2.0/schemas/envelope/1.1.0/envelope.schema.json
        - type: object
          description: What this event adds to the envelope.
          required:
          - type
          - orderid
          - customerid
          - data
          properties:
            type:
              const: com.acme.order.rejected
            orderid:
              type: string
            customerid:
              type: string
            data:
              $ref: '#/components/schemas/orderRejectedData'
      examples:
      - name: acmeOrder4712
        summary: OrderRejected for ACME's order 4712.
        payload:
          specversion: '1.0'
          id: orderRejected-4712-0001
          source: /process-api-order/0.1.0
          type: com.acme.order.rejected
          time: '2026-10-03T09:20:01Z'
          datacontenttype: application/json
          correlationid: ord-4712
          customerid: ACME
          orderid: '4712'
          data:
            orderId: '4712'
            reason: Credit check failed.
            rejectedAt: '2026-10-03T09:20:00Z'
    orderAmended:
      messageId: orderAmended
      name: orderAmended
      title: Order Amended
      summary: The order lines changed (products or quantities) after the order was placed.
      description: CloudEvent of type com.acme.order.amended. The order lines changed (products or quantities) after
        the order was placed. Carries all lines after the amendment.
      contentType: application/cloudevents+json
      payload:
        allOf:
        - $ref: https://raw.githubusercontent.com/azure-intelligence-domain/contracts/v1.2.0/schemas/envelope/1.1.0/envelope.schema.json
        - type: object
          description: What this event adds to the envelope.
          required:
          - type
          - orderid
          - customerid
          - data
          properties:
            type:
              const: com.acme.order.amended
            orderid:
              type: string
            customerid:
              type: string
            data:
              $ref: '#/components/schemas/orderAmendedData'
      examples:
      - name: acmeOrder4711
        summary: OrderAmended for ACME's order 4711.
        payload:
          specversion: '1.0'
          id: orderAmended-4711-0001
          source: /process-api-order/0.1.0
          type: com.acme.order.amended
          time: '2026-10-03T11:00:01Z'
          datacontenttype: application/json
          correlationid: ord-4711
          customerid: ACME
          orderid: '4711'
          data:
            orderId: '4711'
            orderLines:
            - lineNumber: 1
              productId: SKU-1042
              quantity: 12
              unitPrice: *id001
            totalAmount:
              value: 84000.0
              currency: EUR
            amendedAt: '2026-10-03T11:00:00Z'
    orderDeliveryAddressChanged:
      messageId: orderDeliveryAddressChanged
      name: orderDeliveryAddressChanged
      title: Order Delivery Address Changed
      summary: The order will be delivered to another address.
      description: CloudEvent of type com.acme.order.deliveryAddressChanged. The order will be delivered to another
        address.
      contentType: application/cloudevents+json
      payload:
        allOf:
        - $ref: https://raw.githubusercontent.com/azure-intelligence-domain/contracts/v1.2.0/schemas/envelope/1.1.0/envelope.schema.json
        - type: object
          description: What this event adds to the envelope.
          required:
          - type
          - orderid
          - customerid
          - data
          properties:
            type:
              const: com.acme.order.deliveryAddressChanged
            orderid:
              type: string
            customerid:
              type: string
            data:
              $ref: '#/components/schemas/orderDeliveryAddressChangedData'
      examples:
      - name: acmeOrder4711
        summary: OrderDeliveryAddressChanged for ACME's order 4711.
        payload:
          specversion: '1.0'
          id: orderDeliveryAddressChanged-4711-0001
          source: /process-api-order/0.1.0
          type: com.acme.order.deliveryAddressChanged
          time: '2026-10-04T08:00:01Z'
          datacontenttype: application/json
          correlationid: ord-4711
          customerid: ACME
          orderid: '4711'
          data:
            orderId: '4711'
            deliveryAddress: *id002
            changedAt: '2026-10-04T08:00:00Z'
    orderDeliveryRescheduled:
      messageId: orderDeliveryRescheduled
      name: orderDeliveryRescheduled
      title: Order Delivery Rescheduled
      summary: The requested delivery date moved.
      description: CloudEvent of type com.acme.order.deliveryRescheduled. The requested delivery date moved.
      contentType: application/cloudevents+json
      payload:
        allOf:
        - $ref: https://raw.githubusercontent.com/azure-intelligence-domain/contracts/v1.2.0/schemas/envelope/1.1.0/envelope.schema.json
