asyncapi: 2.6.0
id: urn:azure-intelligence-domain:order:process-api-order
info:
  title: '[Order] Order Events'
  version: 0.1.0
  description: 'The business events of the order domain, published by the Order Process API to evgt-intplat-order.
    Names are business facts in the past tense (Event Storming), never CRUD: an order is placed, confirmed, amended,
    put on hold, cancelled, paid or shipped; it is never updated or deleted. Every event carries orderid and customerid
    as business keys and the order''s journey as correlationid (ord-<orderId>). Version 0.x: designed, not implemented
    yet.'
  contact:
    name: Order Domain Team
    url: https://github.com/azure-intelligence-domain/process-api-order
  license:
    name: MIT
    url: https://github.com/azure-intelligence-domain/process-api-order/blob/main/LICENSE
tags:
- name: order
  description: Order domain.
externalDocs:
  description: EventCatalog entry of the order domain
  url: https://azure-intelligence-domain.github.io/eventcatalog/docs/domains/order/1.0.0
defaultContentType: application/cloudevents+json
servers:
  demo-event-grid:
    $ref: https://raw.githubusercontent.com/azure-intelligence-domain/contracts/v1.2.0/asyncapi/landscape.asyncapi.yaml#/components/servers/demo-event-grid
channels:
  order.process-api-order.event.order-placed:
    description: 'A customer committed to an order: a Salesforce opportunity was closed-won, or a webshop or an
      agent placed it. Carries the whole order, so consumers can keep their own copy.'
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.placed
    publish:
      operationId: publishOrderPlaced
      summary: Publish OrderPlaced.
      description: 'The Order Process API publishes OrderPlaced when this fact happens: A customer committed to
        an order: a Salesforce opportunity was closed-won, or a webshop or an agent placed it. Carries the whole
        order, so consumers can keep their own copy.'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderPlaced in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderPlaced
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderPlaced'
  order.process-api-order.event.order-confirmed:
    description: The ERP accepted the order (credit and availability checks passed). Triggered by the ERP's confirmation.
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.confirmed
    publish:
      operationId: publishOrderConfirmed
      summary: Publish OrderConfirmed.
      description: 'The Order Process API publishes OrderConfirmed when this fact happens: The ERP accepted the
        order (credit and availability checks passed). Triggered by the ERP''s confirmation.'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderConfirmed in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderConfirmed
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderConfirmed'
  order.process-api-order.event.order-rejected:
    description: The ERP refused the order, for example a failed credit check. The order ends here.
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.rejected
    publish:
      operationId: publishOrderRejected
      summary: Publish OrderRejected.
      description: 'The Order Process API publishes OrderRejected when this fact happens: The ERP refused the order,
        for example a failed credit check. The order ends here.'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderRejected in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderRejected
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderRejected'
  order.process-api-order.event.order-amended:
    description: The order lines changed (products or quantities) after the order was placed. Carries all lines
      after the amendment.
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.amended
    publish:
      operationId: publishOrderAmended
      summary: Publish OrderAmended.
      description: 'The Order Process API publishes OrderAmended when this fact happens: The order lines changed
        (products or quantities) after the order was placed. Carries all lines after the amendment.'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderAmended in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderAmended
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderAmended'
  order.process-api-order.event.order-delivery-address-changed:
    description: The order will be delivered to another address.
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.deliveryAddressChanged
    publish:
      operationId: publishOrderDeliveryAddressChanged
      summary: Publish OrderDeliveryAddressChanged.
      description: 'The Order Process API publishes OrderDeliveryAddressChanged when this fact happens: The order
        will be delivered to another address.'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderDeliveryAddressChanged in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderDeliveryAddressChanged
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderDeliveryAddressChanged'
  order.process-api-order.event.order-delivery-rescheduled:
    description: The requested delivery date moved.
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.deliveryRescheduled
    publish:
      operationId: publishOrderDeliveryRescheduled
      summary: Publish OrderDeliveryRescheduled.
      description: 'The Order Process API publishes OrderDeliveryRescheduled when this fact happens: The requested
        delivery date moved.'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderDeliveryRescheduled in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderDeliveryRescheduled
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderDeliveryRescheduled'
  order.process-api-order.event.order-put-on-hold:
    description: The order stopped progressing until it is released, for example during a credit approval.
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.putOnHold
    publish:
      operationId: publishOrderPutOnHold
      summary: Publish OrderPutOnHold.
      description: 'The Order Process API publishes OrderPutOnHold when this fact happens: The order stopped progressing
        until it is released, for example during a credit approval.'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderPutOnHold in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderPutOnHold
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderPutOnHold'
  order.process-api-order.event.order-released:
    description: The hold was lifted; the order continues as confirmed.
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.released
    publish:
      operationId: publishOrderReleased
      summary: Publish OrderReleased.
      description: 'The Order Process API publishes OrderReleased when this fact happens: The hold was lifted; the
        order continues as confirmed.'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderReleased in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderReleased
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderReleased'
  order.process-api-order.event.order-cancelled:
    description: 'The order was cancelled (a soft delete: the order keeps existing with status cancelled). Possible
      while placed, confirmed or on hold.'
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.cancelled
    publish:
      operationId: publishOrderCancelled
      summary: Publish OrderCancelled.
      description: 'The Order Process API publishes OrderCancelled when this fact happens: The order was cancelled
        (a soft delete: the order keeps existing with status cancelled). Possible while placed, confirmed or on
        hold.'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderCancelled in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderCancelled
      x-producers:
        demo:
        - process-api-order
      message:
        $ref: '#/components/messages/orderCancelled'
  order.process-api-order.event.order-invoiced:
    description: 'The order was invoiced. Triggered by finance''s InvoiceIssued (policy: when an invoice is issued
      for an order, the order is invoiced).'
    servers:
    - demo-event-grid
    x-configurations:
      demo:
        eventGrid:
          topic: evgt-intplat-order
          eventType: com.acme.order.invoiced
    publish:
      operationId: publishOrderInvoiced
      summary: Publish OrderInvoiced.
      description: 'The Order Process API publishes OrderInvoiced when this fact happens: The order was invoiced.
        Triggered by finance''s InvoiceIssued (policy: when an invoice is issued for an order, the order is invoiced).'
      security:
      - entraIdEventGrid:
        - https://eventgrid.azure.net/.default
      tags:
      - name: order
        description: Order domain.
      externalDocs:
        description: OrderInvoiced in EventCatalog
        url: https://azure-intelligence-domain.github.io/eventcatalog/docs/events/orderInvoiced
      x-producers:
        demo:
        - process-api-order
      message:
