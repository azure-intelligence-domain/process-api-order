    orderDeliveredData:
      type: object
      description: What OrderDelivered says.
      required:
      - orderId
      - deliveredAt
      properties:
        orderId:
          type: string
          description: The order id.
        deliveredAt:
          type: string
          format: date-time
          description: When the order was delivered. ISO 8601, UTC.
    orderCompletedData:
      type: object
      description: What OrderCompleted says.
      required:
      - orderId
      - completedAt
      properties:
        orderId:
          type: string
          description: The order id.
        completedAt:
          type: string
          format: date-time
          description: When the order was completed. ISO 8601, UTC.
